name: App Store Screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Install dependencies
        run: |
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock
          flutter pub get
          DIR=$(ls -d $HOME/.pub-cache/hosted/pub.dev/quill_html_editor-* 2>/dev/null | head -1)
          if [ -n "$DIR" ]; then
            FILE="$DIR/pubspec.yaml"
            echo "Patching: $FILE"
            sed -i '' -e '/^      ios:$/,+1d' -e '/^      android:$/,+1d' "$FILE"
            flutter pub get
          else
            echo "quill_html_editor not found, skipping patch"
          fi
          python3 - <<'PYEOF'
import re
path = "ios/Podfile"
with open(path) as f:
    content = f.read()

marker = "flutter_additional_ios_build_settings(target)"
patch = "\n      config.build_settings['EXCLUDED_ARCHS[sdk=iphonesimulator*]'] = 'arm64'"

if "EXCLUDED_ARCHS[sdk=iphonesimulator*]" not in content:
    content = content.replace(marker, marker + patch, 1)
    with open(path, "w") as f:
        f.write(content)
    print("Patched Podfile with simulator arm64 exclusion")
else:
    print("Podfile already patched")
PYEOF
          cd ios && pod deintegrate && pod install && cd ..

      - name: Build for simulator
        run: flutter build ios --simulator --debug

      - name: Install idb
        run: |
          brew tap facebook/fb
          brew trust facebook/fb
          brew install idb-companion
          pip3 install fb-idb --break-system-packages

      - name: Boot iPhone 16 Pro Max (6.9-inch)
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 16 Pro Max" | head -1 | grep -oE '[0-9A-F-]{36}')
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          idb_companion --udid "$UDID" &
          sleep 5

      - name: Install and launch app
        run: |
          mkdir -p screenshots
          xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$UDID" com.otwgrocers.seller
          sleep 4
          xcrun simctl io "$UDID" screenshot screenshots/01.png

      - name: Capture subsequent auto-transitions
        run: |
          sleep 3
          xcrun simctl io "$UDID" screenshot screenshots/02.png
          sleep 3
          xcrun simctl io "$UDID" screenshot screenshots/03.png
          sleep 3
          xcrun simctl io "$UDID" screenshot screenshots/04.png

      - name: Dump accessibility tree of final screen
        run: |
          idb ui describe-all --udid "$UDID" > screenshots/accessibility_tree.json || echo "idb describe failed, continuing"

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: seller-app-screenshots
          path: screenshots/*